<!-- JS -->
<script>
  const menuToggle = document.getElementById('menu-toggle');
  const menu = document.getElementById('menu');
  menuToggle.addEventListener('click', () => menu.classList.toggle('hidden'));

  document.querySelectorAll('nav a.nav-link').forEach(link => {
    link.addEventListener('click', () => {
      if (window.innerWidth < 768) menu.classList.add('hidden');
    });
  });

  const langEN = document.getElementById('lang-en');
  const langID = document.getElementById('lang-id');
  const translatable = document.querySelectorAll('[data-en]');
  function setLang(lang) {
    translatable.forEach(el => el.textContent = el.getAttribute(`data-${lang}`) || el.textContent);
    if (lang === 'en') {
      langEN.classList.add('active');
      langID.classList.remove('active');
    } else {
      langID.classList.add('active');
      langEN.classList.remove('active');
    }
  }
  langEN.addEventListener('click', () => setLang('en'));
  langID.addEventListener('click', () => setLang('id'));
  setLang('en');

  document.getElementById('darkModeToggle').addEventListener('click', () => document.documentElement.classList.toggle('dark'));

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.style.opacity = '1';
        entry.target.style.transform = 'translateY(0) scale(1)';
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.animate-slide-up, .fade-in').forEach(el => observer.observe(el));
</script>
